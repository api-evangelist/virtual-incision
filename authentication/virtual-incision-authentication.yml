docs_note: Virtual Incision publishes NO authentication documentation of its own — there is no developer portal
  or docs site. The Application Password authorize screen is WordPress core, advertised by the `authentication`
  block of https://virtualincision.com/wp-json/, and requires an existing WordPress login. Nothing on this host
  is obtainable by a member of the public.
note: 'Three distinct schemes on one host: anonymous read for wp/v2 content, WordPress Application Passwords (HTTP
  Basic) or cookie+X-WP-Nonce for wp/v2 writes, and OAuth 2.1 bearer with scope "mcp" for the MCP endpoint. An agent
  must know which surface it is on before it picks a credential.'
