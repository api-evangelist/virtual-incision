  supported: true
  detail: Every wp/v2 content collection (posts, pages, media, event, jobpost and their taxonomies, categories,
    tags, users, search, types, statuses, comments) returned HTTP 200 to an unauthenticated GET. settings, menus,
    plugins and themes returned 401.
