info:
  title: Virtual Incision API (WordPress REST wp/v2) Events API
  version: wp/v2
  summary: The `event` custom post type and its `event-type` taxonomy — conferences and clinical events Virtual Incision attends.
  description: Virtual Incision publishes virtualincision.com on WordPress (WP Engine), which exposes the WordPress REST API at https://virtualincision.com/wp-json/.
  contact:
    name: Virtual Incision
    url: https://virtualincision.com/
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-from: https://virtualincision.com/wp-json/
  x-derived-on: '2026-09-04'
  x-provider-published: false
servers:
- url: https://virtualincision.com/wp-json
  description: Production
security:
- {}
tags:
- name: Events
  description: The `event` custom post type and its `event-type` taxonomy — conferences and clinical events Virtual Incision attends.
paths:
  /wp/v2/event:
    get:
      operationId: getEvent
      summary: GET /wp/v2/event
      description: Anonymous read — observed HTTP 200 without credentials on 2026-09-04.
      tags:
      - Events
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
