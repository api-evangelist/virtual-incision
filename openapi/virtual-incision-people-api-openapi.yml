        description: Reassign the deleted user's posts and links to this user ID.
components:
  schemas:
    WPError:
      type: object
      description: The WordPress REST API error envelope, returned on every 4xx/5xx.
      properties:
        code:
          type: string
          description: Machine-readable error slug, e.g. rest_no_route, rest_forbidden.
        message:
          type: string
          description: Human-readable message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code.
            params:
              type: object
              description: Per-parameter validation messages, when present.
      required:
      - code
      - message
      - data
    Users:
      title: user
      type: object
      properties:
        id:
          description: Unique identifier for the user.
          type: integer
          context:
          - embed
          - view
          - edit
          readonly: true
        username:
          description: Login name for the user.
          type: string
          context:
          - edit
          required: true
        name:
          description: Display name for the user.
          type: string
          context:
          - embed
          - view
          - edit
        first_name:
          description: First name for the user.
          type: string
          context:
          - edit
        last_name:
          description: Last name for the user.
          type: string
          context:
          - edit
        email:
          description: The email address for the user.
          type: string
          format: email
          context:
          - edit
          required: true
        url:
          description: URL of the user.
          type: string
          format: uri
          context:
          - embed
          - view
          - edit
        description:
          description: Description of the user.
          type: string
          context:
          - embed
          - view
          - edit
        link:
          description: Author URL of the user.
          type: string
          format: uri
          context:
          - embed
          - view
          - edit
          readonly: true
        locale:
          description: Locale for the user.
          type: string
          enum:
          - ''
          - en_US
          context:
          - edit
        nickname:
          description: The nickname for the user.
          type: string
          context:
          - edit
        slug:
          description: An alphanumeric identifier for the user.
          type: string
          context:
          - embed
          - view
          - edit
        registered_date:
          description: Registration date for the user.
          type: string
          format: date-time
          context:
          - edit
          readonly: true
        roles:
          description: Roles assigned to the user.
          type: array
          items:
            type: string
          context:
          - edit
        password:
          description: Password for the user (never included).
          type: string
          context: []
          required: true
        capabilities:
          description: All capabilities assigned to the user.
          type: object
          context:
          - edit
          readonly: true
        extra_capabilities:
          description: Any extra capabilities assigned to the user.
          type: object
          context:
          - edit
          readonly: true
        avatar_urls:
          description: Avatar URLs for the user.
          type: object
          context:
          - embed
          - view
          - edit
          readonly: true
          properties:
            '24':
              description: Avatar URL with image size of 24 pixels.
              type: string
              format: uri
              context:
              - embed
              - view
              - edit
            '48':
              description: Avatar URL with image size of 48 pixels.
              type: string
              format: uri
              context:
              - embed
              - view
              - edit
            '96':
              description: Avatar URL with image size of 96 pixels.
              type: string
              format: uri
              context:
              - embed
              - view
              - edit
        meta:
          description: Meta fields.
          type: object
          context:
          - view
          - edit
          properties:
            persisted_preferences:
              type: object
              title: ''
              description: ''
              default: []
              context:
              - edit
              properties:
                _modified:
                  description: The date and time the preferences were updated.
                  type: string
                  format: date-time
                  readonly: false
              additionalProperties: true
        acf:
          description: ACF field data
          type: object
          properties: []
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: WordPress Application Passwords over HTTP Basic. Issued at https://virtualincision.com/wp-admin/authorize-application.php
        (advertised by the wp-json root `authentication` block).
    cookieNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: Logged-in WordPress cookie plus an X-WP-Nonce header — first-party browser context only.
