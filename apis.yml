aid: virtual-incision
name: Virtual Incision
description: 'Virtual Incision Corporation is a Lincoln, Nebraska surgical robotics company, spun out of the University
  of Nebraska in 2006, that builds MIRA — the Miniaturized In vivo Robotic Assistant — and defined the miniaturized
  robotic-assisted surgery (miniRAS) category. MIRA is a roughly two-pound, tray-to-table robot inserted through
  a single umbilical incision, designed to make any operating room robot-ready in minutes. It won FDA De Novo authorization
  for colectomy in 2024 and 510(k) clearance for benign hysterectomy in 2026. Virtual Incision publishes no product
  or developer API: MIRA is regulated capital equipment, not a platform. The machine-readable surface on virtualincision.com
  is the anonymously readable WordPress REST API (newsroom, MIRA pages, events, jobs, media) plus a live but OAuth-gated
  WordPress MCP Adapter endpoint advertised by RFC 8414 and RFC 9728 discovery documents. The company publishes
  a coordinated vulnerability disclosure policy under FDA Section 524B.'
