- aid: virtual-incision:mcp
  name: Virtual Incision MCP Server (WordPress MCP Adapter)
  description: 'A Model Context Protocol endpoint registered under the "mcp" namespace of the virtualincision.com
    WordPress REST route index and served at /wp-json/mcp/mcp-oauth-server (with a second endpoint at /wp-json/mcp/mcp-adapter-default-server).
    The server is live but OAuth-gated: an anonymous JSON-RPC tools/list returns HTTP 401 mcp_unauthorized with
    a WWW-Authenticate Bearer challenge pointing at https://virtualincision.com/.well-known/oauth-protected-resource,
    so the published tool set could not be enumerated. This is the site CMS''s MCP endpoint, not a MIRA product
    MCP server.'
  humanURL: https://virtualincision.com/wp-json/mcp
  baseURL: https://virtualincision.com/wp-json/mcp/mcp-oauth-server
  tags:
